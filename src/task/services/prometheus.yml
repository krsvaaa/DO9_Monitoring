global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: node-exporter
    dns_sd_configs:
      - names:
          - tasks.node-exporter
        type: A
        port: 9100

  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - tasks.cadvisor
        type: A
        port: 8080

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://google.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
        
  - job_name: 'services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - booking-service:8083
          - report-service:8086
          - session-service:8081
          - gateway-service:8087
          
alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: [ 'alertmanager:9093' ]
        
rule_files:
  - /etc/prometheus/alerts.yml
